services:

  # ── Elasticsearch ────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.4
    container_name: babel-es
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -s -u elastic:${ELASTIC_PASSWORD:-changeme} http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"
      interval: 10s
      timeout: 10s
      retries: 30

  # One-time init: sets the kibana_system user password so Kibana can connect.
  kibana-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.4
    container_name: babel-kibana-setup
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: >
      bash -c '
        until curl -s -u "elastic:${ELASTIC_PASSWORD:-changeme}"
          -X POST http://elasticsearch:9200/_security/user/kibana_system/_password
          -H "Content-Type: application/json"
          -d "{\"password\":\"${KIBANA_SYSTEM_PASSWORD:-kibana_changeme}\"}"
          | grep -q "^{}"; do
          sleep 2
        done
        echo "kibana_system password set"
      '

  # ── Kibana (with Babel plugin) ────────────────────────────────────────────────
  # Requires the plugin zip in target/ — run "npm run build" first.
  kibana:
    build:
      context: .
      dockerfile: Dockerfile.kibana
      args:
        KIBANA_VERSION: "9.3.4"
        PLUGIN_VERSION: "2.0.1"
    container_name: babel-kibana
    depends_on:
      kibana-setup:
        condition: service_completed_successfully
    environment:
      - SERVER_NAME=kibana
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-kibana_changeme}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-a_32_character_encryption_key___}
      # Point the plugin at the Sigma API (see sigma-api service below or bring your own)
      - babel.sigmaApiUrl=${SIGMA_API_URL:-http://sigma-api:8001/v1}
      - babel.kibanaUrl=http://localhost:5601
    ports:
      - "127.0.0.1:5601:5601"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -s -I http://localhost:5601 | grep -q '302 Found'"
      interval: 10s
      timeout: 10s
      retries: 30

  # ── Sigma Conversion API ─────────────────────────────────────────────────────
  # Babel requires an external Sigma conversion API for rule translation,
  # validation, field mapping, and analysis. Uncomment and configure this service
  # with your Sigma API image, or point SIGMA_API_URL at an existing deployment.
  #
  # The API must expose the endpoints documented in README.md under
  # "Architecture: the Sigma API".
  #
  # sigma-api:
  #   image: your-sigma-api-image:latest
  #   container_name: babel-api
  #   ports:
  #     - "127.0.0.1:8001:8001"
  #   environment:
  #     - API_KEY=${SIGMA_API_KEY:-}

volumes:
  es-data:
